openapi: 3.1.0
info:
  title: Orchestra Surgical Display API
  version: 0.3.0
  description: >-
    RB-Y1 수술로봇 상태를 Lenovo Y700 화면으로 보내는 단방향 API입니다.
    첫 연동은 state 하나만 필수인 POST /api/v1/state 사용을 권장합니다.
    로봇 제어 기능은 제공하지 않습니다.
servers:
  - url: http://10.77.0.11:8080
    description: Recommended Display 2 Y700 address
tags:
  - name: 처음 연동
    description: 로봇 개발자가 먼저 사용할 간편 State API
  - name: 조회
    description: 태블릿 서버와 최신 화면 상태 확인
  - name: 고급 연동
    description: Python 연동 코드가 내부적으로 사용하는 전체 이벤트 API
paths:
  /api/v1/health:
    get:
      tags: [조회]
      summary: 태블릿 수신 서버 상태 확인
      operationId: getHealth
      responses:
        "200":
          description: Tablet receiver health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/robots:
    get:
      tags: [조회]
      summary: 최신 로봇 State와 연결 상태 확인
      operationId: getRobotSnapshots
      responses:
        "200":
          description: Latest stored state plus independently calculated presence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobotsResponse"
  /api/v1/state:
    post:
      tags: [처음 연동]
      summary: 로봇 State 간편 전송
      operationId: postSimpleSurgicalState
      description: >-
        state만 필수입니다. robot_id를 생략하면 rby1-surgical을 사용합니다.
        이벤트 ID, 세션, 순번, 시간과 중요도는 태블릿이 자동 생성합니다.
        방향이나 음성 인식 결과가 필요할 때만 payload를 추가합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimpleSurgicalStateRequest"
            examples:
              minimum:
                summary: State만 전송
                value:
                  state: COMMAND_READY
              manualDirection:
                summary: 이동 방향 추가
                value:
                  state: MANUAL_MOVING
                  payload:
                    direction: cam_left
              voiceRecognized:
                summary: 음성 인식 성공 추가
                value:
                  state: COMMAND_READY
                  payload:
                    voice_phase: complete
                    recognized_text: 왼쪽
                    recognition_result: recognized
                    command_result: accepted
      responses:
        "202":
          description: State accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "415":
          $ref: "#/components/responses/InvalidRequest"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/events:
    post:
      tags: [고급 연동]
      summary: 전체 상태 또는 연결 확인 이벤트 전송
      operationId: postSurgicalEvent
      description: >-
        Python 연동 코드가 내부적으로 사용하는 고급 API입니다.
        일반적인 로봇 연동에서는 직접 호출하거나 아래 필드를 만들 필요가 없습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurgicalEventRequest"
      responses:
        "202":
          description: Event accepted; duplicate event IDs remain successful and idempotent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptedResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          $ref: "#/components/responses/InvalidRequest"
        "415":
          $ref: "#/components/responses/InvalidRequest"
        "422":
          $ref: "#/components/responses/InvalidRequest"
components:
  responses:
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    SurgicalState:
      type: string
      enum:
        - STARTING
        - AWAITING_START
        - COMMAND_READY
        - MANUAL_MOVING
        - VISUAL_SERVOING
        - RETURNING
        - ERROR
        - PEDAL_MOVING
        - HOLDING
        - PROTECTIVE_RECOVERY
    EventType:
      type: string
      enum: [STATE, HEARTBEAT]
    EventSeverity:
      type: string
      enum: [INFO, WARNING, ERROR]
    Presence:
      type: string
      enum: [CONNECTED, STALE, OFFLINE]
    ActiveArm:
      type: string
      enum: [scope, assist]
    Direction:
      type: string
      enum: [cam_left, cam_right, cam_up, cam_down, insert, retract]
    PedalPhase:
      type: string
      enum: [idle, engaged, decelerating, release_required]
    VoicePhase:
      type: string
      enum: [disabled, listening, recording, transcribing, dispatching, complete, error]
    RecognitionResult:
      type: string
      enum: [recognized, unrecognized]
    VisualPhase:
      type: string
      enum: [waiting_for_target, acquiring, tracking, target_loss_grace, target_lost, handoff_decelerating]
    SurgicalPayload:
      type: object
      additionalProperties: false
      properties:
        step:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,63}$"
        session_active:
          type: boolean
        active_arm:
          $ref: "#/components/schemas/ActiveArm"
        direction:
          $ref: "#/components/schemas/Direction"
        direction_scale:
          type: number
          minimum: 0.1
          maximum: 3.0
          default: 1.0
        pedal_pressed:
          type: boolean
          default: false
        pedal_phase:
          $ref: "#/components/schemas/PedalPhase"
        voice_phase:
          $ref: "#/components/schemas/VoicePhase"
        recognized_text:
          type: string
          minLength: 1
          maxLength: 80
          description: Final short command text for transient operator feedback.
        recognition_result:
          $ref: "#/components/schemas/RecognitionResult"
        command_action:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,63}$"
        command_result:
          type: string
          enum: [accepted, rejected]
        visual_phase:
          $ref: "#/components/schemas/VisualPhase"
        gripper_available:
          type: boolean
        gripper_requested:
          type: string
          enum: [open, close]
        gripper_health:
          type: string
          enum: [ok, unavailable, error]
        safety_reason_code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,63}$"
        motion_label:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
    SurgicalEventRequest:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - event_id
        - event_type
        - robot_id
        - session_id
        - sequence
        - state
        - severity
        - occurred_at
      properties:
        schema_version:
          type: integer
          const: 1
        event_id:
          type: string
          format: uuid
        event_type:
          $ref: "#/components/schemas/EventType"
        robot_id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{1,63}$"
        session_id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{1,63}$"
        sequence:
          type: integer
          minimum: 0
        state:
          $ref: "#/components/schemas/SurgicalState"
        severity:
          $ref: "#/components/schemas/EventSeverity"
        occurred_at:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/SurgicalPayload"
    SimpleSurgicalStateRequest:
      type: object
      description: 첫 연동에 사용하는 간편 요청. state 외의 값은 모두 선택입니다.
      additionalProperties: false
      required: [state]
      properties:
        robot_id:
          type: string
          default: rby1-surgical
          description: 생략하면 rby1-surgical을 사용합니다.
        state:
          $ref: "#/components/schemas/SurgicalState"
        payload:
          $ref: "#/components/schemas/SurgicalPayload"
    EventAcceptedResponse:
      type: object
      required: [accepted, event_id, duplicate, server_received_at]
      properties:
        accepted:
          type: boolean
          const: true
        event_id:
          type: string
          format: uuid
        duplicate:
          type: boolean
        server_received_at:
          type: string
          format: date-time
    ApiErrorResponse:
      type: object
      required: [error, message, fields]
      properties:
        error:
          type: string
        message:
          type: string
        fields:
          type: array
          items:
            type: string
    HealthResponse:
      type: object
      required: [status, api_version, server_time, started_at]
      properties:
        status:
          type: string
          const: ok
        api_version:
          type: string
          const: v1
        server_time:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
    RobotSnapshot:
      type: object
      required: [robot_id, session_id, sequence, state, severity, presence, last_seen_at, payload]
      properties:
        robot_id:
          type: string
        session_id:
          type: string
        sequence:
          type: integer
        state:
          $ref: "#/components/schemas/SurgicalState"
        severity:
          $ref: "#/components/schemas/EventSeverity"
        presence:
          $ref: "#/components/schemas/Presence"
        last_seen_at:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/SurgicalPayload"
    RobotsResponse:
      type: object
      required: [server_time, robots]
      properties:
        server_time:
          type: string
          format: date-time
        robots:
          type: array
          items:
            $ref: "#/components/schemas/RobotSnapshot"
