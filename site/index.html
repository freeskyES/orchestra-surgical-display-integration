<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=https://freeskyes.github.io/orchestra/" />
    <link rel="canonical" href="https://freeskyes.github.io/orchestra/" />
    <title>Orchestra Display Console</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f3f6f8;
        --surface: #ffffff;
        --ink: #122938;
        --muted: #61737e;
        --line: #dce4e8;
        --accent: #137c78;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: var(--ink);
        background: var(--canvas);
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(440px, calc(100% - 32px));
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        text-align: center;
      }

      h1 { margin: 0; font-size: 22px; }
      p { margin: 10px 0 20px; color: var(--muted); font-size: 14px; line-height: 1.6; }

      a {
        display: inline-flex;
        min-height: 42px;
        padding: 0 16px;
        align-items: center;
        border-radius: 9px;
        color: #fff;
        background: var(--accent);
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
    <script>window.location.replace("https://freeskyes.github.io/orchestra/");</script>
  </head>
  <body>
    <main>
      <h1>Orchestra Display Console</h1>
      <p>현장 디스플레이 포털 주소가 변경되었습니다.</p>
      <a href="https://freeskyes.github.io/orchestra/">새 포털 열기</a>
    </main>
  </body>
</html>
